<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Editar portafolio</title>
    <style>
      :root { --ultra: #2430e0; --ink: #0c0e2b; --line: #c3c7ea; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f4f5fd; color: var(--ink); font: 400 1rem/1.5 Poppins, system-ui, sans-serif; }
      .top { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px clamp(16px, 4vw, 40px); background: #fff; border-bottom: 1px solid var(--line); }
      h1 { margin: 0; font-size: 1.125rem; font-weight: 600; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      main { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
      fieldset { margin: 0 0 20px; padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
      legend { padding: 0 8px; font-weight: 600; font-size: 1.0625rem; }
      label { display: block; margin-bottom: 12px; font-weight: 500; font-size: 0.9375rem; }
      input, textarea, select { display: block; width: 100%; margin-top: 4px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-weight: 400; background: #fff; color: inherit; }
      textarea { min-height: 96px; resize: vertical; }
      button { padding: 9px 16px; border: 1px solid var(--ultra); border-radius: 999px; background: #fff; color: var(--ultra); font-family: inherit; font-size: 0.9375rem; font-weight: 600; cursor: pointer; }
      button.primary { background: var(--ultra); color: #fff; }
      button.remove { border-color: #b3261e; color: #b3261e; }
      .entry { padding: 14px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 10px; }
      .project { display: flex; gap: 12px; align-items: center; padding: 6px 0; font-weight: 400; margin: 0; }
      .project input { width: auto; margin: 0; }
      .project img { width: 64px; height: 50px; object-fit: cover; border-radius: 6px; }
      #status { font-size: 0.9375rem; }
      :focus-visible { outline: 3px solid #ffc629; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="top">
      <h1>Editar portafolio</h1>
      <div class="actions">
        <span id="status" role="status"></span>
        <a href="/">Ver sitio</a>
        <button type="button" id="save" class="primary">Guardar cambios</button>
      </div>
    </div>
    <main id="form"></main>
    <script type="module" src="/src/editor.js"></script>
  </body>
</html>
